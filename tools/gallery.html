<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Галерея тайлов — raw и атлас</title>
<style>
body { font-family: system-ui, sans-serif; background: #141414; color: #eee; margin: 0; padding: 16px; }
.tools-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; font-size: 13px; }
.tools-nav a { padding: 6px 12px; border: 1px solid #444; border-radius: 6px; color: #bbb; text-decoration: none; background: #1e1e1e; }
.tools-nav a:hover { color: #fff; border-color: #888; }
.tools-nav a[aria-current="page"] { background: #eee; color: #111; border-color: #eee; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tabs button { padding: 8px 16px; cursor: pointer; background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; }
.tabs button[aria-selected="true"] { background: #eee; color: #111; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; font-size: 13px; color: #bbb; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 8px; text-align: center; }
.card img, .card canvas { width: 130px; height: 130px; image-rendering: pixelated; background: #000; }
.card figcaption { font-size: 12px; color: #ccc; margin-top: 6px; word-break: break-all; }
.hint { font-size: 13px; color: #999; margin: 8px 0; }
h2 { margin: 20px 0 8px; font-size: 18px; }
code { color: #9ad; }
</style>
</head>
<body>
<nav class="tools-nav"><a href="./gallery.html" aria-current="page">Галерея тайлов</a><a href="./level-preview.html">Превью уровня</a></nav>
<h1>Галерея тайлов</h1>
<div class="tabs" role="tablist">
<button id="tab-raw" aria-selected="true">Raw-кадры</button>
<button id="tab-atlas" aria-selected="false">Запечённый атлас</button>
</div>
<div class="controls">
<label>tiles.json <input type="file" id="atlasFile" accept=".json,application/json" /></label>
<span class="hint">По умолчанию грузится через fetch из <code>../public/assets/sprites/tiles.json</code> (открыть через <code>bunx serve .</code> из корня). Raw-кадры выводятся из имён кадров атласа (<code>w307 → raw/wall/307.jpg</code>). Можно перетащить tiles.json на страницу или выбрать вручную.</span>
</div>
<p class="hint" id="status"></p>
<section id="view-raw"><div class="grid" id="rawGrid"></div></section>
<section id="view-atlas" hidden><div class="grid" id="atlasGrid"></div></section>
<script type="module">
const ATLAS_URL = '../public/assets/sprites/tiles.json';
const RAW_URL = '../public/assets/raw/';
const TYPE_DIR = { w: 'wall', s: 'soil', r: 'road' };
const status = document.getElementById('status');
const rawGrid = document.getElementById('rawGrid');
const atlasGrid = document.getElementById('atlasGrid');

function say(t) { status.textContent = t; }
function dirOf(url) { const i = url.lastIndexOf('/'); return i < 0 ? '' : url.slice(0, i + 1); }
function el(tag, text) { const n = document.createElement(tag); if (text !== undefined) n.textContent = text; return n; }
function frameNames(data) {
  return Object.keys(data.frames ?? {}).filter((n) => /^[wsr]\d+$/.test(n)).sort();
}

async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
  return r.json();
}

function renderRaw(data, rawBase) {
  rawGrid.textContent = '';
  const names = frameNames(data);
  if (!names.length) { rawGrid.append(el('p', 'Кадров w*/s*/r* нет')); return; }
  for (const name of names) {
    const type = TYPE_DIR[name[0]], num = name.slice(1);
    const fig = el('figure'); fig.className = 'card';
    const img = el('img');
    img.src = rawBase + type + '/' + num + '.jpg';
    img.alt = name;
    img.loading = 'lazy';
    fig.append(img, el('figcaption', name + ' → raw/' + type + '/' + num + '.jpg'));
    rawGrid.append(fig);
  }
}

async function renderAtlas(data, base) {
  atlasGrid.textContent = '';
  const names = frameNames(data);
  if (!names.length) { atlasGrid.append(el('p', 'Кадров w*/s*/r* нет')); return; }
  const imageUrl = base + (data.meta?.image ?? 'tiles.jpg');
  const sheet = new Image();
  sheet.src = imageUrl;
  try { await sheet.decode(); } catch { await new Promise((res, rej) => { sheet.onload = res; sheet.onerror = rej; }); }
  for (const name of names) {
    const f = data.frames[name].frame;
    const fig = el('figure'); fig.className = 'card';
    const cv = document.createElement('canvas');
    cv.width = f.w; cv.height = f.h;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sheet, f.x, f.y, f.w, f.h, 0, 0, f.w, f.h);
    fig.append(cv, el('figcaption', name + ' (' + f.x + ',' + f.y + ')'));
    atlasGrid.append(fig);
  }
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => { try { resolve(JSON.parse(r.result)); } catch (e) { reject(e); } };
    r.onerror = reject;
    r.readAsText(file);
  });
}

async function boot() {
  let a = null;
  try {
    a = await fetchJson(ATLAS_URL);
    renderRaw(a, dirOf(RAW_URL));
    await renderAtlas(a, dirOf(ATLAS_URL));
  } catch (e) { say('Не загрузился tiles.json: ' + e.message + ' — выберите файл вручную.'); return; }
  say('Готово: кадров ' + frameNames(a).length + '. Откройте обе вкладки для проверки.');
  window.__gallery = { atlas: a };
}

await boot();

document.getElementById('atlasFile').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const data = await readFile(f);
  renderRaw(data, dirOf(RAW_URL));
  await renderAtlas(data, dirOf(ATLAS_URL));
  say('tiles.json загружен из файла: ' + f.name);
});
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', async (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0]; if (!f || !/\.json$/i.test(f.name)) return;
  try {
    const data = await readFile(f);
    if (data.frames) {
      renderRaw(data, dirOf(RAW_URL));
      await renderAtlas(data, dirOf(ATLAS_URL));
      say('Атлас из файла: ' + f.name);
    } else say('Неизвестный JSON: ' + f.name);
  } catch (err) { say('Ошибка чтения ' + f.name + ': ' + err.message); }
});

const tabR = document.getElementById('tab-raw');
const tabA = document.getElementById('tab-atlas');
function select(which) {
  const isR = which === 'r';
  tabR.setAttribute('aria-selected', isR);
  tabA.setAttribute('aria-selected', !isR);
  document.getElementById('view-raw').hidden = !isR;
  document.getElementById('view-atlas').hidden = isR;
}
tabR.onclick = () => select('r');
tabA.onclick = () => select('a');
</script>
</body>
</html>
